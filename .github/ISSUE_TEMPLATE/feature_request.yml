name: Feature request
description: Suggest something bo-grid should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The API or behaviour you have in mind, if any.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Data size, update rate, screen type (a price board, a spreadsheet, a dashboard…).
